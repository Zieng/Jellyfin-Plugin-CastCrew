<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title id="pageTitle">CastCrew Metadata Search</title>
<style>
body{font-family:"Segoe UI","Noto Sans",sans-serif;margin:0}.page{max-width:1400px;margin:auto;padding:24px}.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.toolbar input,.toolbar select,.toolbar button{padding:9px;border-radius:7px;border:1px solid var(--jf-divider-color,#444);background:var(--jf-background-color,#111);color:inherit}.toolbar .wide{grid-column:span 2}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:18px}.card{overflow:hidden;border:1px solid var(--jf-divider-color,#444);border-radius:10px}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.card div{padding:9px}.muted{opacity:.7;font-size:.9em}.actions{display:flex;gap:8px;margin-top:12px}.section{margin-top:16px}
</style></head>
<body><div class="page">
<h1 id="title">Metadata Search</h1>
<div class="toolbar">
<select id="type"><option value="Actor" id="actorOption">Actors</option><option value="Director" id="directorOption">Directors</option><option value="Studio" id="studioOption">Studios / Manufacturers</option></select>
<input id="name" class="wide" placeholder="Name">
<input id="minAge" type="number" placeholder="Min age"><input id="maxAge" type="number" placeholder="Max age">
<input id="minHeight" type="number" placeholder="Min height (cm)"><input id="maxHeight" type="number" placeholder="Max height (cm)">
<input id="minBust" type="number" placeholder="Min bust"><input id="maxBust" type="number" placeholder="Max bust">
<input id="minWaist" type="number" placeholder="Min waist"><input id="maxWaist" type="number" placeholder="Max waist">
<input id="minHip" type="number" placeholder="Min hip"><input id="maxHip" type="number" placeholder="Max hip">
<input id="minVideoCount" type="number" placeholder="Min videos"><input id="maxVideoCount" type="number" placeholder="Max videos">
</div><div class="actions"><button id="search">Search</button><button id="reset">Reset</button></div>
<div id="status" class="section muted"></div><div id="results" class="results"></div><div id="errors" class="section muted"></div>
</div>
<script>
(function(){'use strict';
var ids=['name','minAge','maxAge','minHeight','maxHeight','minBust','maxBust','minWaist','maxWaist','minHip','maxHip','minVideoCount','maxVideoCount'];
var text={en:{title:'Metadata Search',actors:'Actors',directors:'Directors',studios:'Studios / Manufacturers',name:'Name',minAge:'Min age',maxAge:'Max age',minHeight:'Min height (cm)',maxHeight:'Max height (cm)',minBust:'Min bust',maxBust:'Max bust',minWaist:'Min waist',maxWaist:'Max waist',minHip:'Min hip',maxHip:'Max hip',minVideoCount:'Min videos',maxVideoCount:'Max videos',search:'Search',reset:'Reset',loading:'Loading...',results:'Results: ',sources:' | Sources: ',failed:'Search failed: ',age:'Age',height:'Height',videos:'Videos',open:'Open source',unknown:'No results',errors:'Errors'},zh:{title:'元数据搜索',actors:'演员',directors:'导演',studios:'片商 / 制作公司',name:'姓名',minAge:'最小年龄',maxAge:'最大年龄',minHeight:'最小身高（cm）',maxHeight:'最大身高（cm）',minBust:'最小胸围',maxBust:'最大胸围',minWaist:'最小腰围',maxWaist:'最大腰围',minHip:'最小臀围',maxHip:'最大臀围',minVideoCount:'最少影片数',maxVideoCount:'最多影片数',search:'搜索',reset:'重置',loading:'正在加载……',results:'结果：',sources:' | 来源：',failed:'搜索失败：',age:'年龄',height:'身高',videos:'影片数',open:'打开来源',unknown:'没有找到结果',errors:'错误'}};
var lang='en', t=text.en;
function applyLanguage(value){lang=value==='Chinese'||(value==='Auto' && (navigator.language||'').toLowerCase().indexOf('zh')===0)?'zh':'en';t=text[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('pageTitle').textContent=t.title;document.getElementById('title').textContent=t.title;document.getElementById('actorOption').textContent=t.actors;document.getElementById('directorOption').textContent=t.directors;document.getElementById('studioOption').textContent=t.studios;ids.forEach(function(id){document.getElementById(id).placeholder=t[id];});document.getElementById('search').textContent=t.search;document.getElementById('reset').textContent=t.reset;}
function loadLanguage(){if(window.ApiClient&&typeof ApiClient.getPluginConfiguration==='function'){return ApiClient.getPluginConfiguration('a1c3e5f7-2b4d-6e8f-0a1c-3e5f7b9d1e3a').then(function(c){applyLanguage(c&&c.UiLanguage||'Auto');}).catch(function(){applyLanguage('Auto');});}applyLanguage('Auto');return Promise.resolve();}
function url(){var q=new URLSearchParams();q.set('type',document.getElementById('type').value);ids.forEach(function(id){var v=document.getElementById(id).value;if(v)q.set(id,v);});q.set('limit','100');var base=window.ApiClient&&ApiClient.getUrl?ApiClient.getUrl('CastCrew/Metadata/Search'): '/CastCrew/Metadata/Search';return base+(base.indexOf('?')>=0?'&':'?')+q.toString();}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function search(){document.getElementById('status').textContent=t.loading;fetch(url(),{headers:window.ApiClient&&ApiClient.getRequestHeaders?ApiClient.getRequestHeaders():{}}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(function(data){document.getElementById('status').textContent=t.results+(data.TotalRecordCount||0)+t.sources+(data.EnabledSources||[]).join(', ');document.getElementById('errors').textContent=(data.Errors||[]).join(' | ');var items=data.Items||[];document.getElementById('results').innerHTML=items.length?items.map(function(x){var meta=[];if(x.Age)meta.push(t.age+': '+x.Age);if(x.HeightCm)meta.push(t.height+': '+x.HeightCm+'cm');if(x.VideoCount)meta.push(t.videos+': '+x.VideoCount);return '<article class="card">'+(x.ImageUrl?'<img loading="lazy" src="'+esc(x.ImageUrl)+'">':'')+'<div><strong>'+esc(x.Name)+'</strong><div class="muted">'+esc(x.Source)+'</div><div>'+esc(meta.join(' · '))+'</div>'+(x.ProfileUrl?'<div><a href="'+esc(x.ProfileUrl)+'" target="_blank" rel="noreferrer">'+t.open+'</a></div>':'')+'</div></article>';}).join(''):'<div class="muted">'+t.unknown+'</div>';}).catch(function(e){document.getElementById('status').textContent=t.failed+e.message;});}
document.getElementById('search').onclick=search;document.getElementById('reset').onclick=function(){ids.forEach(function(id){document.getElementById(id).value='';});search();};document.getElementById('type').onchange=function(){var studio=this.value==='Studio';['minAge','maxAge','minHeight','maxHeight','minBust','maxBust','minWaist','maxWaist','minHip','maxHip','minVideoCount','maxVideoCount'].forEach(function(id){document.getElementById(id).disabled=studio;});};loadLanguage().then(search);
})();
</script></body></html>
